# cbindgen configuration for generating C header from Rust FFI
# Run: cbindgen --config cbindgen.toml --crate mongodb --output include/mongodb_ffi.h

# Generate C header (not C++)
language = "C"

# Header comment
header = """/*
 * MongoDB Rust Driver FFI - Auto-generated C header
 *
 * This header is generated by cbindgen from the Rust FFI module.
 * Do not edit manually.
 *
 * Usage:
 *   1. Link against libmongodb.so / libmongodb.dylib / mongodb.dll
 *   2. Include this header
 *   3. Call mongo_client_new() to create a client
 *
 * Thread safety:
 *   - MongoClient handles are thread-safe
 *   - Callbacks may be invoked from any thread
 */"""

trailer = "/* End of auto-generated header */"

# Add forward declaration for opaque types after includes
after_includes = """
// Forward declaration of opaque client type
struct MongoClient;
"""

# Documentation style
documentation_style = "c99"

[export]
item_types = ["enums", "structs", "typedefs", "functions", "constants"]

[enum]
rename_variants = "ScreamingSnakeCase"

[fn]
args = "auto"

[struct]
rename_fields = "None"

[parse]
parse_deps = false

# Map Option<fn pointer> to nullable C function pointer
# Option<extern "C" fn(...)> has the same ABI as a nullable C function pointer
[export.rename]
"Option<CommandEventCallback>" = "CommandEventCallback"
